{{define "main"}}
<div class="admin-page">
  <header>
    <h2>Posts</h2>
    <a href="/admin/new" class="btn-primary">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New post
    </a>
  </header>
  <ul class="admin-list">
    {{range .Posts}}
    <li>
      <div class="date">{{formatDate .Date}}</div>
      <div class="title">
        <a href="/admin/edit?slug={{.Slug}}">{{if .Title}}{{.Title}}{{else}}<em>(untitled)</em>{{end}}</a>
        {{if .Draft}}<span class="draft-pill">Draft</span>{{end}}
      </div>
      <div class="tags">{{range $i, $t := .Tags}}{{if $i}} {{end}}#{{$t}}{{end}}</div>
      <div class="actions">
        <a class="icon-btn" href="/posts/{{.Slug}}/" target="_blank" title="View"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></a>
        <a class="icon-btn" href="/admin/edit?slug={{.Slug}}" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a>
        <form method="post" action="/admin/delete" onsubmit="return confirm('Delete this post?');" style="margin:0;">
          <input type="hidden" name="slug" value="{{.Slug}}">
          <button type="submit" class="icon-btn" title="Delete" style="color: oklch(0.55 0.16 25);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
        </form>
      </div>
    </li>
    {{else}}
    <li style="grid-template-columns: 1fr; color: var(--muted); font-style: italic; padding: 32px 0;">
      還沒有文章 — 點上面的 <strong>+ New post</strong> 開始寫第一篇。
    </li>
    {{end}}
  </ul>
</div>
{{end}}
