{{define "main"}}
<div class="admin-page" style="max-width: 480px; padding-top: 80px;">
  <header style="margin-bottom: 24px;">
    <h2>Sign in</h2>
  </header>
  <div class="editor-side" style="display: block;">
    <div class="card">
      <h6>Authentication</h6>
      <p style="font-size: 14px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 16px;">
        用 GitHub 帳號 <code style="font-family: var(--mono); font-size: 13px; background: var(--accent-soft); color: var(--accent-ink); padding: 1px 6px; border-radius: 3px;">{{.Site.Admin.User}}</code> 登入。需要先在終端機跑過 <code style="font-family: var(--mono); font-size: 13px;">gh auth login</code>。
      </p>
      {{if .Error}}<p style="background: oklch(0.95 0.04 28); border-left: 3px solid oklch(0.55 0.16 25); padding: 10px 14px; font-size: 13px; color: oklch(0.35 0.1 25); margin: 0 0 16px;">{{.Error}}</p>{{end}}
      <form method="post" action="/admin/login">
        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Sign in with GitHub</button>
      </form>
      <p style="font-size: 12px; color: var(--muted); margin: 16px 0 0; text-align: center;">Admin server 只 bind 127.0.0.1，外部無法存取。</p>
    </div>
  </div>
</div>
{{end}}
