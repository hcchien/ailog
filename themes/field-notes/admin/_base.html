{{define "_base"}}<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{if .Title}}{{.Title}} · {{end}}ailog admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme/style.css">
  <script src="/theme/admin.js" defer></script>
</head>
<body>
  <div class="admin-shell">
    <div class="admin-bar">
      <div class="inner">
        <span class="brand">{{.Site.Title}}<span class="sub" style="display: block; font-family: var(--mono); margin-top: 2px;">admin · 127.0.0.1</span></span>
        <span class="pill">Draft mode</span>
        <nav>
          <a href="/admin" class="{{if eq .Active "list"}}active{{end}}">Posts</a>
          <a href="/admin/new" class="{{if eq .Active "edit"}}active{{end}}">New</a>
          <a href="{{.Site.BaseURL}}{{.Site.BasePath}}/" target="_blank" rel="noopener">View ↗</a>
          {{if .User}}
          <form method="post" action="/admin/logout" style="display:inline">
            <button type="submit" style="background:none; border:1px solid rgba(255,255,255,0.2); border-left:none; color: inherit; cursor: pointer; font: inherit; padding: 6px 12px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;">Logout</button>
          </form>
          {{end}}
        </nav>
      </div>
    </div>
    {{block "main" .}}{{end}}
  </div>
</body>
</html>
{{end}}
