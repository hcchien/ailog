{{define "tag.html"}}{{template "_base" .}}{{end}}

{{define "head"}}{{end}}

{{define "main"}}
<h1>#{{.Tag}}</h1>
<ul class="post-list">
  {{range .Posts}}
  <li>
    <a class="post-link" href="{{url .URL}}">
      <span class="post-date">{{formatDate .Date}}</span>
      <span class="post-title">{{.Title}}</span>
    </a>
  </li>
  {{end}}
</ul>
<p class="back"><a href="{{url "/tags/"}}">← all tags</a></p>
{{end}}
