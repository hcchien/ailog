{{define "tags.html"}}{{template "_base" .}}{{end}}

{{define "head"}}{{end}}

{{define "main"}}
<h1>Tags</h1>
<ul class="tag-cloud">
  {{range .Tags}}
  <li><a href="{{url (printf "/tags/%s/" .Name)}}">#{{.Name}}</a> <span class="tag-count">{{.Count}}</span></li>
  {{else}}
  <li class="empty">沒有 tag。</li>
  {{end}}
</ul>
{{end}}
