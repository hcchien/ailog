{{define "_base"}}<!doctype html>
<html lang="{{.Site.Language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{if .Title}}{{.Title}} · {{end}}{{.Site.Title}}</title>
  {{if .Site.Description}}<meta name="description" content="{{.Site.Description}}">{{end}}
  <link rel="alternate" type="application/rss+xml" title="{{.Site.Title}}" href="{{url "/rss.xml"}}">
  <link rel="stylesheet" href="{{url "/style.css"}}">
  {{block "head" .}}{{end}}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{url "/"}}">{{.Site.Title}}</a>
    <nav>
      <a href="{{url "/"}}">home</a>
      <a href="{{url "/tags/"}}">tags</a>
      <a href="{{url "/rss.xml"}}">rss</a>
    </nav>
  </header>
  <main>
    {{block "main" .}}{{end}}
  </main>
  <footer class="site-footer">
    <span>© {{year}} {{.Site.Author}}</span>
    <span>built with ailog</span>
  </footer>
</body>
</html>
{{end}}
