{{define "_base"}}<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{if .Title}}{{.Title}} · {{end}}ailog admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
  <style>
    :root { --pico-font-size: 95%; }
    body > header, body > main, body > footer { max-width: 64rem; margin: 0 auto; padding-inline: 1.25rem; }
    body > header { display: flex; align-items: baseline; justify-content: space-between; padding-top: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--pico-muted-border-color); }
    body > header nav a { margin-left: 1rem; }
    body > footer { color: var(--pico-muted-color); font-size: 0.85rem; padding-block: 2rem; }
    .post-list { list-style: none; padding: 0; }
    .post-list li { display: flex; gap: 1rem; align-items: baseline; padding: 0.6rem 0; border-bottom: 1px solid var(--pico-muted-border-color); }
    .post-list .date { font-family: ui-monospace, monospace; color: var(--pico-muted-color); font-size: 0.85rem; min-width: 7rem; }
    .post-list .title { flex: 1; text-decoration: none; color: var(--pico-color); }
    .post-list .draft-pill { background: var(--pico-secondary-background); color: var(--pico-secondary); font-size: 0.7rem; padding: 0.15rem 0.45rem; border-radius: 999px; }
    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 900px) { .editor-grid { grid-template-columns: 1fr; } }
    .preview-pane { border: 1px solid var(--pico-muted-border-color); border-radius: 8px; padding: 1rem 1.25rem; max-height: 70vh; overflow-y: auto; }
    .preview-pane h1, .preview-pane h2, .preview-pane h3 { line-height: 1.3; }
    .preview-pane pre { background: var(--pico-code-background-color); padding: 0.75rem; border-radius: 4px; overflow-x: auto; }
    .preview-pane code { background: var(--pico-code-background-color); padding: 0.1em 0.3em; border-radius: 3px; }
    .preview-pane img { max-width: 100%; height: auto; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 600px) { .meta-grid { grid-template-columns: 1fr; } }
    .EasyMDEContainer .CodeMirror { min-height: 50vh; }
    .danger { background: var(--pico-del-color, #b91c1c); color: white; border-color: transparent; }
    .danger:hover { filter: brightness(1.1); }
    .flash { background: var(--pico-secondary-background); padding: 0.5rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .flash.error { background: #fee2e2; color: #7f1d1d; }
  </style>
</head>
<body>
  <header>
    <strong><a href="/admin">ailog admin</a></strong>
    <nav>
      {{if .User}}
      <a href="/admin">posts</a>
      <a href="/admin/new">new</a>
      <a href="/" target="_blank">view site ↗</a>
      <form method="post" action="/admin/logout" style="display:inline; margin-left:1rem;">
        <button class="secondary outline" type="submit" style="padding: 0.15rem 0.65rem; font-size: 0.8rem;">logout ({{.User.Login}})</button>
      </form>
      {{end}}
    </nav>
  </header>
  <main>
    {{block "main" .}}{{end}}
  </main>
  <footer>
    <span>ailog admin · 127.0.0.1 only</span>
  </footer>
</body>
</html>
{{end}}
