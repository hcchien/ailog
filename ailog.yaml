title: ailog
description: A lightweight blog
author: hcchien
baseURL: https://hcchien.github.io
language: zh-Hant

# Public theme: aperture
theme: aperture

# Sub-path the site is served from. Leave blank for root.
# - GitHub Pages project site (hcchien.github.io/ailog/) → basePath: /ailog
# - User site (hcchien.github.io/) or custom domain at root → basePath: ""
basePath: /ailog

# Custom domain for GitHub Pages (leave blank for *.github.io)
# When set, a CNAME file is written into dist/ at build time.
# Setting this usually means basePath should be "" and baseURL should be the
# domain.
customDomain: ""

# Admin server settings (used by `ailog admin`)
admin:
  user: hcchien        # only this GitHub username can log in
  port: 8080           # bound to 127.0.0.1
  postsDir: content/posts
  uploadsDir: public/images
  autoPush: true       # commit + push to GitHub after every save

# Display
postsPerPage: 20
